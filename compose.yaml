services:
  mirror:
    build: .
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      TV_LAN_IP: ${TV_LAN_IP:?Set TV_LAN_IP to this Mac's private Wi-Fi or Ethernet IPv4 address}
      SENDER_PORT: 8765
      RECEIVER_PORT: 8766
      PUBLIC_PORT: ${APP_PORT:-8768}
    ports:
      - "127.0.0.1:${APP_PORT:-8768}:8765"
      - "${TV_LAN_IP}:${APP_PORT:-8768}:8766"
    # No Docker socket, host screen/audio devices, credentials, or host mounts.
    # No restart policy: a reboot must not silently start screen-sharing services.
